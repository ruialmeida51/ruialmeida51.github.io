<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{% if page.title and page.layout == 'post' %}{{ page.title | escape }} | Blog | Rui aka Eyther{% else %}Blog | Rui aka Eyther{% endif %}</title>
	<meta name="description" content="{% if page.summary %}{{ page.summary | escape }}{% else %}{{ site.description | escape }}{% endif %}">
	<meta name="theme-color" content="#0d1117">
	<meta property="og:title" content="{{ page.title | default: 'Blog' | escape }}">
	<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%E2%9C%8D%EF%B8%8F%3C/text%3E%3C/svg%3E">
	<link rel="alternate" type="application/atom+xml" title="Blog" href="/blog/feed.xml">
	<link rel="stylesheet" href="/assets/css/style.css">
	<link rel="stylesheet" href="/assets/css/blog.css">
	<link rel="stylesheet" href="/assets/css/season.css">
	<link rel="stylesheet" href="/assets/css/secrets.css">
	<script src="/assets/js/season.js"></script>
	<script>
		// Set theme before first paint to avoid a flash.
		try {
			var t = localStorage.getItem("theme");
			if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
			document.documentElement.setAttribute("data-theme", t);
		} catch (e) {}
	</script>
</head>
<body>

<header class="nav">
	<div class="wrap">
		<a class="brand" href="/">eyther<span>.dev</span></a>
		<ul>
			<li><a href="/">Home</a></li>
			<li><a href="/blog/" aria-current="page">Blog</a></li>
			<li><a href="/grind/">The Grind</a></li>
		</ul>
		<button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle light/dark theme" aria-pressed="false">🌓</button>
	</div>
</header>

<main>
{{ content }}
</main>

<footer>
	<div class="wrap">
		<p>Powered by ☕ and nostalgia.</p>
	</div>
</footer>

<div id="toast" role="status" aria-live="polite"></div>

<script src="/assets/js/now.js"></script>
<script src="/assets/js/main.js"></script>
<script src="/assets/js/secrets.js"></script>
</body>
</html>
